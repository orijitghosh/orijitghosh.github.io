<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A 24-hour dial: ZT0 at the top, the dark phase shaded on the left, the sun on its hand. -->
  <circle cx="32" cy="32" r="31" fill="#0a0c11"/>
  <path d="M32 7a25 25 0 0 0 0 50z" fill="#ede7db" fill-opacity=".14"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#ede7db" stroke-opacity=".45" stroke-width="2"/>
  <g transform="rotate(40 32 32)">
    <line x1="32" y1="32" x2="32" y2="15" stroke="#ede7db" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="13" r="6" fill="#f5b83d" stroke="#0a0c11" stroke-width="2.5"/>
  </g>
  <circle cx="32" cy="32" r="3.2" fill="#ede7db"/>
</svg>
