# One-liner under the name in the hero (HTML allowed)
tagline: 'Visiting postdoctoral fellow at the <abbr title="National Institutes of Health">NIH</abbr>, studying how the circadian clock and sleep shape each other.'

# Lead sentence at the top of the Research section (HTML allowed).
statement: 'In the lab, I record behavior across thousands of fruit flies over days of light and darkness, then pair statistical models with quantitative genetics to ask how the <em>circadian clock</em> and <em>sleep</em> genetic networks talk to each other.'

# Author name patterns to auto-bold in publications.
# String matching is case-sensitive. Order matters: longer patterns first.
author_bold_patterns:
  - "Ghosh, Arijit"
  - "Arijit Ghosh"
  - "Ghosh Arijit"
  - "Ghosh A"

# Bio paragraphs shown on home page (HTML allowed)
bio:
  - 'I am a visiting postdoctoral fellow in <a href="https://www.nhlbi.nih.gov/science/systems-genetics#Meet-the-Team">Susan Harbison’s group</a> at the Laboratory of Systems Genetics, SBC, NHLBI, NIH in Bethesda, Maryland. I study how the circadian clock and sleep genetic networks interact to shape behavior and physiology. During my PhD with <a href="https://www.jncasr.ac.in/faculty/sheeba">Vasu Sheeba</a> at the Chronobiology and Behavioural Neurogenetics Laboratory, <a href="https://www.jncasr.ac.in/research/research-units/neuroscience-unit">JNCASR</a>, Bengaluru, I studied genetic and molecular influences on the timing of behavior (<a href="https://en.wikipedia.org/wiki/Chronotype">chronotypes</a>), both under the control of and independent from the circadian clock.'
  - 'My work combines behavioral recordings in <em>Drosophila</em> with statistical modeling, quantitative genetics, and multi-omics. Earlier, during my integrated MSc at <a href="https://www.niser.ac.in/">NISER, Bhubaneswar</a>, I studied thermo-sensitive Transient Receptor Potential (TRP) ion channels and their role in osteogenesis using primary bone cells, rodent models, pharmacology, and molecular dynamics.'
  - 'I grew up in <a href="https://en.wikipedia.org/wiki/Bardhaman">Burdwan, West Bengal</a>, went to school at <a href="https://rkmvp.org/">RKMV Purulia</a> and <a href="https://www.rkmvnarendrapur.org/">RKMV Narendrapur</a>, and moved from Bhubaneswar to Bengaluru before coming to Bethesda. Outside the lab, I enjoy photography, science fiction, good food, and building small open-source R packages (including hand-drawn plots in <a href="https://github.com/orijitghosh/ggsketch">ggsketch</a> and Indian landscape palettes in <a href="https://github.com/orijitghosh/prakriti">prakriti</a>).'

