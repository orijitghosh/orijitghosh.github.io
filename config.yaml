# Research section on the home page. Each block sits next to an interactive
# figure (an actogram and a sleep-state hypnogram). HTML allowed.
research:
  actogram:
    title: "Reading an actogram"
    text:
      - 'Most mornings in chronobiology start by looking at an <em>actogram</em>: each row plots 48 hours of a single fly’s movement, two days side by side so rhythms crossing midnight stay continuous. Under a 12:12 light–dark cycle (days 1–7), wild-type flies anticipate dawn and dusk with a quiet midday siesta in between.'
      - 'When we switch the incubator to constant darkness (DD, day 8 onward), those peaks keep recurring on internal time, drifting each day according to the fly’s free-running period, τ. Try the classic <em>period</em> alleles below—first isolated by Konopka &amp; Benzer in 1971—or drag the slider to see how clock speed reshapes behavior.'
  sleep_states:
    title: "Inferring hidden sleep states"
    text:
      - 'In standard infrared beam-break monitors, bouts of at least five minutes of immobility are conventionally scored as sleep. This useful rule groups together periods of rest that may differ in sleep depth.'
      - 'Our hidden Markov models (<a href="https://nhlbi.github.io/FlyDreamR/">FlyDreamR</a>) infer four behavioral states from movement recordings, labeled active wake, quiet wake, light sleep, and deep sleep. In separate DART arousal experiments, independently fitted four-state models identified states that differed in their responses to mechanical stimulation, supporting an interpretation of graded sleep depth. These are inferred behavioral states rather than electrophysiologically defined sleep stages; we use them to investigate how genetic variation relates to sleep and waking behavior.'
      - 'The animation is a generative example: a simulated hidden state sequence produces activity counts. The lower trace shows that generating sequence, not states inferred from the displayed counts. Both research figures are illustrative simulations, not experimental recordings, and the animation’s probabilities are chosen for illustration rather than fitted to data.'
    links:
      - label: "Read the bioRxiv preprint"
        url: "https://www.biorxiv.org/content/10.64898/2026.01.14.699526v1"
      - label: "FlyDreamR package"
        url: "https://nhlbi.github.io/FlyDreamR/"

